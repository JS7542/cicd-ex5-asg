name: GitOps ASG CICD Pipeline

on:
  push:
    branches: ["main"]


# ============================================================
# 공통 환경변수
# ============================================================
env:
  AWS_REGION: ${{ secrets.AWS_REGION }}

  ECR_REGISTRY: 925047940866.dkr.ecr.ap-east-1.amazonaws.com
  ECR_REPOSITORY: nginx

  NGINX_IMAGE_TAG: 1.31.3-ecr
  FASTAPI_IMAGE_TAG: 1.0.0-ecr

  S3_BUCKET: ${{ secrets.S3_BUCKET_NAME }}

  APP_DIR: /opt/std20-app
  NGINX_LOG_DIR: /home/ec2-user/nginx/logs


jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # 1. GitHub Repository Checkout
      # ======================================================
      - name: 소스 코드 Checkout
        uses: actions/checkout@v4


      # ======================================================
      # 2. Docker Hub Login
      #
      # Dockerfile의 FROM nginx 등이 Docker Hub에서
      # 이미지를 가져오는 경우 사용
      # ======================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}


      # ======================================================
      # 3. AWS 인증
      # ======================================================
      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}


      # ======================================================
      # 4. ECR Login
      # ======================================================
      - name: Login to AWS ECR
        uses: aws-actions/amazon-ecr-login@v2


      # ======================================================
      # 5. Docker Image Build & Push
      # ======================================================
      - name: Build and Push Docker Image
        run: |
          docker build \
            --no-cache \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$NGINX_IMAGE_TAG \
            ./nginx

          docker build \
            --no-cache \
            -t $ECR_REGISTRY/$ECR_REPOSITORY:$FASTAPI_IMAGE_TAG \
            ./fastapi

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:$FASTAPI_IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$FASTAPI_IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker tag \
            $ECR_REGISTRY/$ECR_REPOSITORY:$NGINX_IMAGE_TAG \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:$NGINX_IMAGE_TAG

          docker push \
            $ECR_REGISTRY/$ECR_REPOSITORY:latest


      # ======================================================
      # 6. Docker Compose → S3
      # ======================================================
      - name: Docker Compose S3 업로드
        run: |
          aws s3 cp \
            ./docker-compose.yaml \
            s3://$S3_BUCKET/docker-compose.yaml


      # ======================================================
      # 7. ASG EC2에 SSM 배포
      # ======================================================
      - name: ASG Docker Container 배포
        run: |
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Cicd,Values=asg" \
            --parameters "commands=[
              \"mkdir -p $APP_DIR\",
              \"mkdir -p $NGINX_LOG_DIR\",

              \"echo 'ECR_REGISTRY=$ECR_REGISTRY' > $APP_DIR/.env\",
              \"echo 'ECR_REPOSITORY=$ECR_REPOSITORY' >> $APP_DIR/.env\",
              \"echo 'NGINX_IMAGE_TAG=$NGINX_IMAGE_TAG' >> $APP_DIR/.env\",
              \"echo 'FASTAPI_IMAGE_TAG=$FASTAPI_IMAGE_TAG' >> $APP_DIR/.env\",

              \"aws ecr get-login-password --region $AWS_REGION | docker login --username AWS --password-stdin $ECR_REGISTRY\",

              \"aws s3 cp s3://$S3_BUCKET/docker-compose.yaml $APP_DIR/docker-compose.yaml\",

              \"docker compose -p std20-app -f $APP_DIR/docker-compose.yaml --env-file $APP_DIR/.env pull\",

              \"docker compose -p std20-app -f $APP_DIR/docker-compose.yaml --env-file $APP_DIR/.env down || true\",

              \"docker compose -p std20-app -f $APP_DIR/docker-compose.yaml --env-file $APP_DIR/.env up -d --remove-orphans\",

              \"docker image prune -f\"
            ]" \
            --region "$AWS_REGION" \
            --comment "Deploy nginx container to ASG instances"