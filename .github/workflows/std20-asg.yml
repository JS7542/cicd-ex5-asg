name: GitOps ASG CICD Pipeline

on:
  push:
    branches: ["main"]

# 2. 작업 정의
jobs:
  build-and-update:
    runs-on: ubuntu-latest    # 실제 작업 주체
    steps:
      - name: 소스 코드 전송
        uses: actions/checkout@v4

      - name: Login to Docker Hub
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}



      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ECR에 Docker 이미지 빌드 및 푸시
      - name: Login to AWS ECR
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2
        
      - name: Build and push Docker image to ECR
        env:
        #   ECR_REGISTRY: ${{ secrets.ECR_REGISTRY = 925047940866.dkr.ecr.ap-east-1.amazonaws.com }}
        #   ECR_REPOSITORY: ${{ secrets.ECR_REGISTRY = nginx }}
          IMAGE_TAG: 1.31.3-ecr # ${{github.sha}}
        run: |
          docker build --no-cache -t 925047940866.dkr.ecr.ap-east-1.amazonaws.com/nginx:$IMAGE_TAG ./nginx
          docker build --no-cache -t 925047940866.dkr.ecr.ap-east-1.amazonaws.com/nginx:latest ./nginx

          docker push 925047940866.dkr.ecr.ap-east-1.amazonaws.com/nginx:$IMAGE_TAG
          docker push 925047940866.dkr.ecr.ap-east-1.amazonaws.com/nginx:latest

      - name: S3 도커 컴포즈 받아오기
        run: |
          aws s3 cp ./docker-compose.yaml s3://${{ secrets.S3_BUCKET_NAME }}/

      - name: Docker 컨테이너 배포 및 s3 파일 싱크
        run: |
          # ECR 에서 이미지 가져오기 및 HTML 파일 동기화
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Cicd,Values=asg" \
            --parameters  "commands =[
              \"sudo aws ecr get-login-password --region ap-east-1 | docker login --username AWS --password-stdin 925047940866.dkr.ecr.ap-east-1.amazonaws.com\",
              \"sudo docker stop nginx_container || true\",
              \"sudo docker rm nginx_container || true\",
              \"sudo aws s3 cp s3://${{ secrets.S3_BUCKET_NAME }}/docker-compose.yaml ./docker-compose.yaml\",
              \"sudo docker-compose pull\",
              \"sudo docker-compose down || true\",
              \"sudo docker-compose up -d --remove-orphans\",
              \"sudo docker image prune -f\"
            ]" \
            --region "${{ secrets.AWS_REGION }}" \
            --comment "Deploy nginx Docker container and sync S3 bucket to nginx html directory"