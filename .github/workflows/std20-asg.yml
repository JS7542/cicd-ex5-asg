      #     aws ssm send-command \
      #       --instance-ids "${{ secrets.INSTANCE_ID }}" \
      #       --document-name "AWS-RunShellScript" \
      #       --parameters  "commands =[
      #         \"sudo docker pull ${{ secrets.DOCKER_HUB_USERNAME }}/nginx:1.31.3-cd\",
