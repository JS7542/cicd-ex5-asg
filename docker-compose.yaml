services:
  my-service-web:
    image: ${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}
    container_name: nginx-container

    ports:
      - "80:80"

    volumes:
      - /home/ec2-user/nginx/logs:/var/log/nginx

    restart: always

    networks:
      - app-network

networks:
  app-network:
    driver: bridge
